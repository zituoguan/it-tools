about:
  content: >
    # O IT-Tools

    Ta wspaniała strona, stworzona z ❤ przez [Corentina
    Thomasseta](https://corentin.tech?utm_source=it-tools&utm_medium=about),
    zbiera przydatne narzędzia dla programistów i osób pracujących w IT. Jeśli
    uznasz ją za pomocną, nie zapomnij się nią podzielić i dodać do ulubionych!

    IT Tools jest open-source (na licencji MIT) i darmowe, i takie pozostanie,
    ale koszty związane z jego hostingiem i odnawianiem domeny spoczywają na
    mnie. Jeśli chcesz wesprzeć moją pracę i zmotywować mnie do dodania
    kolejnych narzędzi, zachęcam do
    [wsparcia](https://www.buymeacoffee.com/cthmsst).

    ## Technologie

    IT Tools zostało stworzone w Vue.js (Vue 3) z wykorzystaniem biblioteki
    komponentów Naive UI i jest hostowane oraz ciągle wdrażane przez Vercel.
    Niektóre narzędzia korzystają z zewnętrznych bibliotek open-source, pełną
    listę znajdziesz w pliku
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    repozytorium.

    ## Znalazłeś błąd? Brakuje jakiegoś narzędzia?

    Jeśli potrzebujesz narzędzia, które nie jest jeszcze dostępne, a uważasz, że
    mogłoby być przydatne, zapraszam do zgłoszenia propozycji funkcji w [sekcji
    issue](https://github.com/sharevb/it-tools/issues/new/choose) repozytorium
    GitHub.
